# Pages CMS configuration: https://pagescms.org/docs/configuration/
# Field types for every file in data/ are defined here.

media:
  - name: pub
    label: Publication images
    input: assets/pub
    output: assets/pub
    extensions: [jpg, jpeg, png, gif, webp]
  - name: mem
    label: Member photos
    input: assets/mem
    output: assets/mem
    extensions: [jpg, jpeg, png, webp]
  - name: vid
    label: Videos
    input: assets/video
    output: assets/video
    extensions: [mp4, webm]

# Bilingual text, stored as { "en": "...", "nl": "..." }.
# English is required; the site falls back to English when Dutch is empty.
components:
  i18n-string:
    type: object
    fields:
      - name: en
        label: English
        type: string
        required: true
      - name: nl
        label: Nederlands
        type: string
  i18n-string-optional:
    type: object
    fields:
      - name: en
        label: English
        type: string
      - name: nl
        label: Nederlands
        type: string
  i18n-text-optional:
    type: object
    fields:
      - name: en
        label: English
        type: text
      - name: nl
        label: Nederlands
        type: text
  i18n-text:
    type: object
    fields:
      - name: en
        label: English
        type: text
        required: true
      - name: nl
        label: Nederlands
        type: text

content:
  - name: home
    label: Home intro
    type: file
    path: data/home.json
    format: json
    fields:
      - name: prelude
        label: Prelude
        description: "The short paragraph above the homepage title."
        component: i18n-text
      - name: title
        label: Title (first part)
        description: "e.g. Now, an observatory for"
        component: i18n-string
      - name: highlight
        label: Title (highlighted part)
        description: "Shown in blue italics after the first part, e.g. human behaviour"
        component: i18n-string
      - name: intro
        label: Intro text
        description: "The paragraph under the homepage title."
        component: i18n-text

  - name: milestones
    label: Milestones (Home)
    type: file
    path: data/milestones.json
    format: json
    list: true
    fields:
      - name: time
        label: Time
        type: string
        description: "MM/YYYY (e.g. 09/2024) or YYYY. Leave empty for Today and Future."
        pattern:
          regex: "^((0[1-9]|1[0-2])/[0-9]{4}|[0-9]{4})?$"
          message: "Use MM/YYYY (e.g. 09/2024) or YYYY"
      - name: status
        label: Status
        type: select
        required: true
        options:
          values:
            - name: normal
              label: Normal
            - name: today
              label: Today
            - name: future
              label: Future
      - name: text
        label: Text
        description: "One short sentence (about 40 characters)."
        component: i18n-string
      - name: url
        label: Link (optional)
        type: string
        description: "Makes the milestone text a link, e.g. the paper's DOI (https://doi.org/...)."
        pattern:
          regex: "^(https://\\S+)?$"
          message: "Must be a full link starting with https://"

  - name: questions-page
    label: Research page text
    type: file
    path: data/questions-page.json
    format: json
    fields:
      - name: title
        label: Title (first part)
        component: i18n-string
      - name: highlight
        label: Title (highlighted part)
        component: i18n-string
      - name: intro
        label: Intro paragraph (optional)
        description: "Hidden while the English text is empty."
        component: i18n-text-optional
      - name: frameworkTitle
        label: Animation heading
        description: "Heading above the 'map of behaviour' animation."
        component: i18n-string
      - name: frameworkText
        label: Animation text
        component: i18n-text
      - name: flowCaption
        label: Left animation caption
        component: i18n-string
      - name: mapCaption
        label: Right animation caption
        component: i18n-string

  - name: questions
    label: Research questions
    type: file
    path: data/questions.json
    format: json
    list: true
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: "Short fixed name, lowercase with hyphens (e.g. lifetime). Team members link to it; do not change it once in use. When adding or removing a question, also update the 'topic' options under team."
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: "Lowercase letters, numbers and hyphens only (e.g. brain-behaviour)"
      - name: short
        label: Short name
        description: "2-3 words, shown on the topic button of team member cards (e.g. Brain disorders)."
        component: i18n-string
      - name: question
        label: Question
        component: i18n-string
      - name: answer
        label: Answer
        component: i18n-text
      - name: art
        label: Artwork style
        type: select
        description: "The abstract artwork drawn on the card when no image is uploaded. Empty or Automatic = a style picked from the title. New styles are added in js/discovery-art.js (MOTIFS) and then listed here."
        options:
          values:
            - { name: auto, label: Automatic }
            - { name: resilience, label: Resilience }
            - { name: multiday, label: Multi-day rhythms }
            - { name: goal, label: Goal }
            - { name: behavioural-age, label: Behavioural age }
            - { name: sound, label: Sound }
            - { name: epilepsy, label: Epilepsy }
            - { name: sleep, label: Sleep }
            - { name: dopamine, label: Dopamine }
            - { name: plasticity, label: Plasticity }
            - { name: constraint, label: Constraint }
            - { name: complexity, label: Complexity }
            - { name: jid-map, label: "JID: map" }
            - { name: jid-lifespan, label: "JID: lifespan" }
            - { name: jid-trajectory, label: "JID: trajectory" }
            - { name: jid-neural, label: "JID: neural" }
            - { name: jid-disorder, label: "JID: disorder" }

  - name: discoveries-page
    label: Discoveries page text
    type: file
    path: data/discoveries-page.json
    format: json
    fields:
      - name: title
        label: Title (first part)
        component: i18n-string
      - name: highlight
        label: Title (highlighted part)
        component: i18n-string
      - name: intro
        label: Intro paragraph
        component: i18n-text

  - name: discoveries
    label: Discoveries (papers)
    type: file
    path: data/discoveries.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        component: i18n-string
      - name: summary
        label: Short summary
        component: i18n-text
      - name: image
        label: Image or GIF
        type: image
        description: "Optional. Replaces the drawn artwork. Keep GIFs small (under about 2 MB) so the page loads quickly."
        options:
          media: pub
      - name: art
        label: Artwork style
        type: select
        description: "The abstract artwork drawn on the card when no image is uploaded. Empty or Automatic = a style picked from the title. New styles are added in js/discovery-art.js (MOTIFS) and then listed here."
        options:
          values:
            - { name: auto, label: Automatic }
            - { name: resilience, label: Resilience }
            - { name: multiday, label: Multi-day rhythms }
            - { name: goal, label: Goal }
            - { name: behavioural-age, label: Behavioural age }
            - { name: sound, label: Sound }
            - { name: epilepsy, label: Epilepsy }
            - { name: sleep, label: Sleep }
            - { name: dopamine, label: Dopamine }
            - { name: plasticity, label: Plasticity }
            - { name: constraint, label: Constraint }
            - { name: complexity, label: Complexity }
            - { name: jid-map, label: "JID: map" }
            - { name: jid-lifespan, label: "JID: lifespan" }
            - { name: jid-trajectory, label: "JID: trajectory" }
            - { name: jid-neural, label: "JID: neural" }
            - { name: jid-disorder, label: "JID: disorder" }
      - name: authors
        label: Authors
        type: string
        required: true
        description: "As shown on the site, e.g. Ceolini, Ridderinkhof & Ghosh"
      - name: journal
        label: Journal
        type: string
        required: true
      - name: year
        label: Year
        type: number
        required: true
        description: "The site lists papers newest first by this year."
        options:
          min: 1990
          max: 2100
      - name: url
        label: Paper link
        type: string
        description: "Full link to the paper, preferably the DOI (https://doi.org/...)."
        pattern:
          regex: "^(https://\\S+)?$"
          message: "Must be a full link starting with https://"

  - name: video
    label: Video (Discoveries)
    type: file
    path: data/video.json
    format: json
    fields:
      - name: src
        label: Video file
        type: file
        description: "MP4 (H.264) plays in every browser. Keep it small (under about 50 MB; GitHub rejects files over 100 MB). Leave empty to hide the video."
        options:
          media: vid
      - name: poster
        label: Cover image (optional)
        type: image
        description: "Shown before the video plays. Empty = the video's first frame. With no video file, this image is shown on its own as a placeholder."
        options:
          media: pub

  - name: partners-page
    label: Partners page text
    type: file
    path: data/partners-page.json
    format: json
    fields:
      - name: title
        label: Title (first part)
        component: i18n-string
      - name: highlight
        label: Title (highlighted part)
        component: i18n-string
      - name: themes
        label: Research themes
        type: object
        list: true
        description: "The theme filter buttons and network labels on the Partners page. When adding or removing a theme, also update the 'Themes' options under Partners."
        fields:
          - name: id
            label: ID
            type: string
            required: true
            description: "Short fixed name, lowercase with hyphens (e.g. brain-recordings). Partners link to it; do not change it once in use."
            pattern:
              regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
              message: "Lowercase letters, numbers and hyphens only"
          - name: label
            label: Label
            component: i18n-string

  - name: partners
    label: Partners
    type: file
    path: data/partners.json
    format: json
    list: true
    fields:
      - name: name
        label: Name
        component: i18n-string
      - name: short
        label: Short name (optional)
        type: string
        description: "Label in the network diagram, e.g. Yale. Empty = the full English name."
      - name: group
        label: Group
        type: select
        required: true
        options:
          values:
            - name: research
              label: Research partner
            - name: funder
              label: Funder (Funded by)
            - name: spinoff
              label: Spin-off
      - name: themes
        label: Themes
        type: select
        description: "Research partners only. Keep these options in sync with the theme IDs under Partners page text."
        options:
          multiple: true
          values:
            - { name: epilepsy, label: Epilepsy }
            - { name: brain-recordings, label: Brain recordings }
            - { name: sleep, label: Sleep }
            - { name: adolescence, label: Adolescence }
            - { name: ageing, label: Ageing }
            - { name: physical-activity, label: Physical activity }
            - { name: complex-systems, label: Complex systems }
            - { name: cognition, label: Cognition }
            - { name: rehabilitation, label: Rehabilitation }
      - name: focus
        label: Focus (optional)
        description: "Research partners only: one line under the name, e.g. Invasive EEG recordings."
        component: i18n-string-optional
      - name: location
        label: Location
        description: "City or country. Optional for spin-offs."
        component: i18n-string-optional
      - name: founded
        label: Founded (year)
        type: number
        description: "Spin-offs only: shown instead of the location while the location is empty."
        options:
          min: 1900
          max: 2100
      - name: url
        label: Website
        type: string
        required: true
        pattern:
          regex: "^https://\\S+$"
          message: "Must be a full link starting with https://"
      - name: contact
        label: Contact person (optional)
        description: "Stored only: the site does not display this at the moment."
        type: object
        fields:
          - name: name
            label: Name
            type: string
          - name: url
            label: Profile link
            type: string
            pattern:
              regex: "^(https://\\S+)?$"
              message: "Must be a full link starting with https://"

  - name: resources
    label: Resources (patents, data, code)
    type: file
    path: data/resources.json
    format: json
    list: true
    fields:
      - name: type
        label: Type
        type: select
        required: true
        description: "Publications are not listed here: they come from Arko Ghosh's Google Scholar / ORCID links under Team."
        options:
          values:
            - name: patent
              label: Patent
            - name: data
              label: Data
            - name: code
              label: Code
      - name: name
        label: Name
        component: i18n-string
      - name: summary
        label: Short description
        component: i18n-text
      - name: url
        label: Link
        type: string
        required: true
        pattern:
          regex: "^https://\\S+$"
          message: "Must be a full link starting with https://"

  - name: team
    label: Team
    type: file
    path: data/team.json
    format: json
    list: true
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: "Short fixed name, lowercase with hyphens (e.g. arko-ghosh)."
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: "Lowercase letters, numbers and hyphens only (e.g. arko-ghosh)"
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        description: "Master's students: include 'MSc' in the English role (e.g. MSc thesis student). They are listed after the staff."
        component: i18n-string
      - name: tag
        label: Filter tags
        type: select
        required: true
        description: "Which filter buttons on the Team page show this person. Current members: pick one. Alumni: pick Alumni plus their former role; both are shown on the card. A new tag name also needs adding to TAG_ORDER in js/team.js."
        options:
          multiple: true
          values: [Principal Investigator, Researcher, Visiting Researcher, MSc Student, Pre-University, Alumni]
      - name: status
        label: Status
        type: select
        required: true
        options:
          values:
            - name: current
              label: Current member
            - name: alumni
              label: Alumni
      - name: joined
        label: Joined
        type: string
        description: "MM/YYYY (e.g. 09/2024) or YYYY."
        pattern:
          regex: "^((0[1-9]|1[0-2])/[0-9]{4}|[0-9]{4})?$"
          message: "Use MM/YYYY (e.g. 09/2024) or YYYY"
      - name: photo
        label: Photo
        type: image
        options:
          media: mem
      - name: topic
        label: Research topic
        type: select
        description: "The research question shown as a button on the member card. Keep these options in sync with the IDs under Research questions."
        options:
          values:
            - name: brain-behaviour
              label: Brain & behaviour
            - name: patterns-over-time
              label: Patterns over time
            - name: lifetime
              label: Across a lifetime
            - name: brain-disorders
              label: Brain disorders
      - name: scholar
        label: Google Scholar link
        type: string
        description: "For Arko Ghosh, also shown in the Publications section of the Resources page."
        pattern:
          regex: "^(https://\\S+)?$"
          message: "Must be a full link starting with https://"
      - name: orcid
        label: ORCID link
        type: string
        description: "e.g. https://orcid.org/0000-0000-0000-0000. Shown as an iD badge on the Team page; for Arko Ghosh also in the Publications section of the Resources page."
        pattern:
          regex: "^(https://\\S+)?$"
          message: "Must be a full link starting with https://"
      - name: sample
        label: Sample data (to be replaced)
        type: boolean
        description: "Ticked = this member's timeline is still example text. Untick once real content is filled in."
      - name: timeline
        label: Personal timeline
        type: object
        list: true
        description: "Shown left to right from oldest to newest."
        fields:
          - name: time
            label: Time
            type: string
            description: "MM/YYYY (e.g. 09/2024) or YYYY."
            pattern:
              regex: "^((0[1-9]|1[0-2])/[0-9]{4}|[0-9]{4})?$"
              message: "Use MM/YYYY (e.g. 09/2024) or YYYY"
          - name: text
            label: Short text
            description: "2-5 words."
            component: i18n-string
          - name: detailTitle
            label: Detail title (optional)
            description: "Fill in together with Detail if this point should open when clicked."
            component: i18n-string-optional
          - name: detail
            label: Detail (optional)
            description: "Fill in only if this point should open with more text when clicked."
            component: i18n-text-optional

  - name: news
    label: In the news (Discoveries)
    type: file
    path: data/news.json
    format: json
    list: true
    fields:
      - name: featured
        label: Featured in
        type: boolean
        description: "Ticked = the outlet name is also shown in the 'Featured in' row at the top of In the news (in the order of this list)."
      - name: outlet
        label: Outlet
        type: string
        required: true
      - name: title
        label: Headline
        type: string
        required: true
      - name: year
        label: Year
        type: number
        required: true
        options:
          min: 1990
          max: 2100
      - name: url
        label: Link
        type: string
        required: true
        pattern:
          regex: "^https://\\S+$"
          message: "Must be a full link starting with https://"
