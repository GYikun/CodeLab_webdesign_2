  <div class="wrap header-inner">
    <a class="brand" href="index.html" aria-label="CODELAB, Leiden University">

    <nav class="nav" id="primary-nav" aria-label="Primary">

      </nav>

<main>

<!-- CURRENT MEMBERS -->
<section class="team-section">
  <div class="wrap">

    <div class="tmember-list" id="staffList"></div>

    <div class="tmember-list" id="studentList"></div>

  </div>
</section>

<!-- ALUMNI: same cards, collapsed by default, at the foot of the page -->
<section class="alumni-section">
  <div class="wrap">
    <div class="alumni-head reveal">
      <button class="alumni-toggle" id="alumniToggle" type="button"
              aria-expanded="false" aria-controls="alumniPanel">

    </div>
    <div id="alumniPanel" class="tmember-list" hidden></div>
  </div>
</section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <span class="footer-brand"><strong>Code</strong>Lab</span>
      <span class="footer-sub" data-i18n="brandSub">Leiden University</span>
    </div>
    <p class="footer-note">&copy; <span id="year">2026</span> <span data-i18n="footerNote">CODELAB, Leiden University. Wassenaarseweg 52, Leiden.</span></p>
  </div>
</footer>

<script src="js/main.js" charset="utf-8"></script>
<script src="js/data.js" charset="utf-8"></script>
<script src="js/team.js?v=6" charset="utf-8"></script>
<script>
/* renderTeam() builds the member threads and returns the EN/NL strings
   for everything it generated. Merge them into the page dictionary so
   the existing data-i18n machinery in main.js drives both.

   All non-ASCII text below is written as \uXXXX escapes on purpose, so
   this file survives being saved in any encoding. */
/* Fail loudly if the team styles (in css/styles.css) are missing - without them the avatars
   expand and the whole card layout collapses, which is hard to
   diagnose from the page alone. */
(function () {
  var probe = document.createElement('div');
  probe.className = 'tmember';
  probe.style.position = 'absolute';
  probe.style.visibility = 'hidden';
  document.body.appendChild(probe);
  var loaded = getComputedStyle(probe).borderTopWidth !== '0px';
  probe.remove();
  if (!loaded) {
    console.error('[CodeLab] team styles did not load. The team page ' +
      'will render unstyled (oversized avatars, collapsed cards). ' +
      'Check that css/styles.css exists and the <link> tag path is correct.');
  }
})();

/* Members come from data/team.json; their topic buttons use the short
   names in data/questions.json. */
CodeLabData.load(['team', 'questions']).then(function (data) {
  var threads = { en: {}, nl: {} };
  if (!data.team) {
    CodeLabData.showError(document.getElementById('staffList'));
    document.querySelector('.alumni-section').hidden = true;
  } else {
    threads = renderTeam(data.team, data.questions);
  }
  initSite({
    en: Object.assign({}, threads.en),
    nl: Object.assign({}, threads.nl)
  });
});
</script>
</body>
</html>
